
# Overwritting configs
rand_seed: 2024
reproducibility: true
proactive: 1

num_proc: 0
data_dir: datasets/
log_dir: run_logs/
tensorboard_log_dir: tensorboard/
ckpt_dir: ckpt/

stage: pretrain        # pretrain or finetune
pretrained_model: ""


# data selection
epoch_per_stage: [80, 20, 20, 20, 20, 20, 20]
tau: 1.0
load_best_for_next_stage: False

train_batch_size: 1024
eval_batch_size: 128
lr: 0.005
weight_decay: 0.05
warmup_steps: 10000
steps: ~
epochs: 200
max_grad_norm: 1.0      # None for no clipping, else a float value
eval_interval: 10        # Evaluate every n epochs
save_interval: 10
patience: 100            # Early stopping. Stop training after n epochs without improvement. Set to None to disable

topk: [1,5,10]

metrics: [ctr_max,coherence_max,IoI_max,IoR_max,error]  # proactive task evaluation metrics
val_metric: IoI_max@10
val_ratio: 1.0
val_delay: 50  # when to calculate metrics

# Config for proactive rec
max_proactive_length: 10  # max number of items in proactive path

# Config for Tokenizer
n_codebooks: 3
codebook_size: 256
expand_final: True
token_prefix: "qwen3-embedding-8b-pca"
token_suffix: "sem_ids"

# Config for T5 Transformers
n_user_tokens: 1      # Number of user tokens hashed from user ids
max_item_seq_len: 15  # Maximum #items in a sequence
user_id_used: 0

# Config for T5
num_layers: 3
num_decoder_layers: 3
d_model: 128
d_ff: 512
num_heads: 4
d_kv: 64
dropout_rate: 0.1
activation_function: "relu"
feed_forward_proj: "relu"
results_dir: ~

sem_id_epochs: []
