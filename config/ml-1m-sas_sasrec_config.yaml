data_path: ./datasets/
dataset: ml-1m-sas
gpu_id: 1

SESSION_ID_FIELD: session_id
field_separator: ","

USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
TIME_FIELD: timestamp

load_col:
    inter: [user_id, item_id, session_id, timestamp]
    user: [user_id, gender, age, occupation]
    item: [item_id, genres]


eval_setting: TO_LS, full
metrics: [Recall, MRR, NDCG, Precision]
topk: [10, 20]
valid_metric: MRR@10

train_neg_sample_args: ~


model: SASRec

# Hyperparameters
embedding_size: 64     
n_layers: 2             
n_heads: 2             
hidden_size: 64         
inner_size: 256         
dropout_prob: 0.5       
loss_type: 'CE'         

MAX_ITEM_LIST_LENGTH: 50

learning_rate: 0.001
train_batch_size: 8192
eval_batch_size: 8192
epochs: 100
stopping_step: 10      

checkpoint_dir: 'ckpt'